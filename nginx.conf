worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    client_max_body_size 50M;
    charset utf-8;

    # ──────────────────────────────────────────────────────────────────
    # ☁️ CLOUDFLARE & DOCKER REAL IP: Restaurar IP original del usuario
    # ──────────────────────────────────────────────────────────────────
    # IPs de Cloudflare
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # Para no ignorar la cabecera de Cloudflare cuando pasa por el proxy de Docker
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 100.64.0.0/10; # IPs de Tailscale
    set_real_ip_from 127.0.0.1;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # ── CONFIGURACIÓN DE RATE LIMITING ──
    # FIX: burst=0 nodelay para bloquear inmediatamente sin acumular cola
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=2fa_limit:10m rate=10r/m;

    limit_req_status 429;

    # En el bloque http {}, añadir mapa para detectar el protocolo real
    map $remote_addr $forwarded_proto_real {
        default               $http_x_forwarded_proto;
        # Rango de la red Docker interna — ajusta si tu subnet es diferente
        "~^172\.19\."         "https";
        # Por si acaso también cubre la IP exacta
        "172.19.0.9"          "https";
    }

    server {
        listen 80;
        server_name _; # Captura cualquier dominio no configurado

        # ── CONFIGURACIÓN DE ERRORES ──
        proxy_intercept_errors on;
        error_page 404 /views/error404.html;

        # ── Monitorización Nginx ──
        location /nginx_status {
            stub_status;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 10.0.0.0/8;
            deny all;
        }

        # ── SERVIR LA PÁGINA DE ERROR ──
        location = /views/error404.html {
            root /usr/share/nginx/html;
            internal;
        }

        # ──────────────────────────────────────────────────────────────────
        # 🔐 SEGURIDAD: Rate Limiting para Login y 2FA
        # ──────────────────────────────────────────────────────────────────

        location /login {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass         http://web:3000;
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $forwarded_proto_real;
        }

        location /login/2fa {
            limit_req zone=2fa_limit burst=3 nodelay;
            proxy_pass         http://web:3000;
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $forwarded_proto_real;
        }
        location /metrics {
            deny all;
            return 403;
        }

        # ──────────────────────────────────────────────────────────────────
        # 🔐 SEGURIDAD: Protección de avatares
        # ──────────────────────────────────────────────────────────────────

        location /avatars/ {
            deny all;
            return 403;
        }

        location /avatar/ {
            proxy_pass         http://web:3000;
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $forwarded_proto_real;
            proxy_cache_valid  200 1d;
            proxy_cache_valid  404 10m;
        }

        # ──────────────────────────────────────────────────────────────────
        # 🌐 CORS: Proxy a OpenFoodFacts API
        # ──────────────────────────────────────────────────────────────────
        location /api/openfoodfacts/ {
            rewrite ^/api/openfoodfacts/(.*)$ /$1 break;
            proxy_pass         https://world.openfoodfacts.org;
            proxy_ssl_verify   off;

            proxy_set_header   Host              world.openfoodfacts.org;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   User-Agent        "Wget/1.21.3";

            add_header 'Access-Control-Allow-Origin'      '*' always;
            add_header 'Access-Control-Allow-Methods'     'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Content-Type, Authorization' always;

            if ($request_method = 'OPTIONS') { return 204; }

            proxy_cache_valid  200 1d;
            proxy_cache_valid  404 10m;
            proxy_read_timeout 30s;
        }

        # ──────────────────────────────────────────────────────────────────
        # App principal
        # ──────────────────────────────────────────────────────────────────
        location / {
            proxy_pass              http://web:3000;
            proxy_set_header        Host              $http_host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            # Usar el proto corregido en lugar de $scheme (que siempre será http aquí)
            proxy_set_header        X-Forwarded-Proto $forwarded_proto_real;

            proxy_set_header        CF-Connecting-IP  $http_cf_connecting_ip;
            proxy_set_header        CF-Visitor        $http_cf_visitor;
            proxy_set_header        Upgrade           $http_upgrade;
            proxy_set_header        Connection        "upgrade";

            proxy_read_timeout      120s;
            proxy_connect_timeout   120s;
        }

        location /grafana/ {
            return 403;
        }
    }
}