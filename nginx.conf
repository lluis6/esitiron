worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    client_max_body_size 50M;
    charset utf-8;

    # ── CONFIGURACIÓN DE RATE LIMITING ──
    # Definimos una zona para el login normal (1 petición por segundo)
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=1r/s;
    
    # Definimos una zona MUY estricta para el 2FA (3 peticiones por minuto)
    limit_req_zone $binary_remote_addr zone=2fa_limit:10m rate=3r/m;

    # Formato de error personalizado para cuando se exceda el límite
    limit_req_status 429;

    server {
        listen 80;
        server_name _;

        # ── Monitorización Nginx ──
        location /nginx_status {
            stub_status;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 10.0.0.0/8;
            deny all;
        }

        # ──────────────────────────────────────────────────────────────────
        # 🔐 SEGURIDAD: Rate Limiting para Login y 2FA
        # ──────────────────────────────────────────────────────────────────

        # 1. Protección contra Fuerza Bruta en Login
        location /login {
            # Aplicamos el límite de 1r/s con un "burst" de 5 para permitir 
            # algún refresco accidental pero bloquear scripts de ataque.
            limit_req zone=login_limit burst=5 nodelay;

            proxy_pass         http://web:3000;
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # 2. Protección contra ataques a códigos 2FA y Backup
        # (Ajusta la ruta si tu endpoint es distinto, ej: /api/auth/2fa)
        location /login/2fa {
            # Límite ultra estricto: máximo 3 intentos cada minuto.
            limit_req zone=2fa_limit burst=1 nodelay;

            proxy_pass         http://web:3000;
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ──────────────────────────────────────────────────────────────────
        # 🔐 SEGURIDAD: Protección de avatares
        # ──────────────────────────────────────────────────────────────────
        
        location /avatars/ {
            deny all;
            return 403;
        }

        location /avatar/ {
            proxy_pass         http://web:3000;
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_valid  200 1d;
            proxy_cache_valid  404 10m;
        }

        # ──────────────────────────────────────────────────────────────────
        # 🌐 CORS: Proxy a OpenFoodFacts API
        # ──────────────────────────────────────────────────────────────────
        location /api/openfoodfacts/ {
            rewrite ^/api/openfoodfacts/(.*)$ /$1 break;
            proxy_pass         https://world.openfoodfacts.org;
            proxy_ssl_verify   off;
            
            proxy_set_header   Host              world.openfoodfacts.org;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   User-Agent        "Wget/1.21.3";
            
            add_header 'Access-Control-Allow-Origin'      '*' always;
            add_header 'Access-Control-Allow-Methods'     'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Content-Type, Authorization' always;
            
            if ($request_method = 'OPTIONS') { return 204; }
            
            proxy_cache_valid  200 1d;
            proxy_cache_valid  404 10m;
            proxy_read_timeout 30s;
        }

        # ──────────────────────────────────────────────────────────────────
        # App principal
        # ──────────────────────────────────────────────────────────────────
        location / {
            proxy_pass         http://web:3000;
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            
            proxy_set_header   CF-Connecting-IP  $http_cf_connecting_ip;
            proxy_set_header   CF-Visitor        $http_cf_visitor;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            
            proxy_read_timeout 120s;
            proxy_connect_timeout 120s;
        }

        location /grafana/ {
            return 403;
        }
    }
}