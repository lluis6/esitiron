worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    client_max_body_size 50M;
    charset utf-8;

    # ── CONFIGURACIÓN DE RATE LIMITING ──
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=2fa_limit:10m rate=3r/m;

    limit_req_status 429;

    server {
        listen 80;
        server_name _; # Captura cualquier dominio no configurado

        # ── CONFIGURACIÓN DE ERRORES ──
        # Permite que Nginx intercepte errores 404 del backend y muestre nuestra página
        proxy_intercept_errors on;
        
        # Ruta de la página de error (buscada dentro de /usr/share/nginx/html)
        error_page 404 /views/error404.html;

        # ── Monitorización Nginx ──
        location /nginx_status {
            stub_status;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 10.0.0.0/8;
            deny all;
        }

        # ── SERVIR LA PÁGINA DE ERROR (Desde la carpeta compartida) ──
        location = /views/error404.html {
            root /usr/share/nginx/html;
            internal;
        }

        # ──────────────────────────────────────────────────────────────────
        # 🔐 SEGURIDAD: Rate Limiting para Login y 2FA
        # ──────────────────────────────────────────────────────────────────

        location /login {
            limit_req zone=login_limit burst=5 nodelay;

            proxy_pass         http://web:3000;
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /login/2fa {
            limit_req zone=2fa_limit burst=1 nodelay;

            proxy_pass         http://web:3000;
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ──────────────────────────────────────────────────────────────────
        # 🔐 SEGURIDAD: Protección de avatares
        # ──────────────────────────────────────────────────────────────────
        
        location /avatars/ {
            deny all;
            return 403;
        }

        location /avatar/ {
            proxy_pass         http://web:3000;
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_valid  200 1d;
            proxy_cache_valid  404 10m;
        }

        # ──────────────────────────────────────────────────────────────────
        # 🌐 CORS: Proxy a OpenFoodFacts API
        # ──────────────────────────────────────────────────────────────────
        location /api/openfoodfacts/ {
            rewrite ^/api/openfoodfacts/(.*)$ /$1 break;
            proxy_pass         https://world.openfoodfacts.org;
            proxy_ssl_verify   off;
            
            proxy_set_header   Host              world.openfoodfacts.org;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   User-Agent        "Wget/1.21.3";
            
            add_header 'Access-Control-Allow-Origin'      '*' always;
            add_header 'Access-Control-Allow-Methods'     'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Content-Type, Authorization' always;
            
            if ($request_method = 'OPTIONS') { return 204; }
            
            proxy_cache_valid  200 1d;
            proxy_cache_valid  404 10m;
            proxy_read_timeout 30s;
        }

        # ──────────────────────────────────────────────────────────────────
        # App principal
        # ──────────────────────────────────────────────────────────────────
        location / {
            proxy_pass         http://web:3000;
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            
            proxy_set_header   CF-Connecting-IP  $http_cf_connecting_ip;
            proxy_set_header   CF-Visitor        $http_cf_visitor;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            
            proxy_read_timeout 120s;
            proxy_connect_timeout 120s;
        }

        location /grafana/ {
            return 403;
        }
    }
}