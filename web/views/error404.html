<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esítiron — Error</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="icon" type="image/png" href="/img/logo.jpg">
  <link rel="stylesheet" href="/css/responsive.css">
  <style>
    .error-main {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - var(--nav-h));
    }
    .error-card {
      width: 100%;
      max-width: 760px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 3rem 2.5rem;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .error-emoji { font-size: 4rem; margin-bottom: 0.25rem; }
    .error-code {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(5.5rem, 14vw, 9rem);
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), #34D399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 0.75rem;
    }
    .error-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.75rem;
      margin-bottom: 0.75rem;
    }
    .error-text { color: var(--text2); font-size: 1.05rem; margin-bottom: 2rem; }
    .error-actions { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: var(--trans-fast);
    }
    .btn-primary { background: var(--accent); color: #fff; box-shadow: var(--shadow-accent); }
    .btn-primary:hover { background: var(--accent-hv); transform: translateY(-1px); }
    .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="nav-links">
    <a href="/dashboard" class="nav-link">📊 Dashboard</a>
    <a href="/tiquets"   class="nav-link">🧾 Tiquets</a>
    <a href="/productos" class="nav-link">🛍️ Productos</a>
    <a href="/grupos"    class="nav-link">👥 Grupos</a>
  </div>
  <div class="nav-right">
    <div class="user-menu-wrap" id="userMenuWrap">
      <div class="nav-user" id="userTrigger" onclick="toggleMenu()">
        {% if avatar_url %}
          <img src="{{ avatar_url }}" class="avatar" style="object-fit:cover;" alt="avatar">
        {% else %}
          <div class="avatar">{{ usuario[0] | upper }}</div>
        {% endif %}
        <span class="nav-username">{{ usuario }}</span>
      </div>
      <div class="user-dropdown" id="userDropdown">
        <div class="ud-header">
          <div class="ud-name">{{ usuario }}</div>
          <div class="ud-email">{{ usuario_email }}</div>
        </div>
        <a href="/perfil" class="ud-item">👤 Mi perfil</a>
        <div class="ud-divider"></div>
        <a href="/logout" class="ud-item danger">⏻ Cerrar sesión</a>
      </div>
    </div>
    <button class="theme-toggle" id="theme-toggle" title="Cambiar tema">
      <span id="icon-sun">☀️</span>
      <span id="icon-moon" style="display:none">🌙</span>
    </button>
  </div>
</nav>

<main class="main error-main">
  <section class="error-card">
    <div class="error-emoji">🧩</div>
    <h1 class="error-code">404</h1>
    <h2 class="error-title">¿Te has perdido?</h2>
    <p class="error-text">No hemos podido encontrar la página o el tiquet que buscas.</p>

    <div class="error-actions">
      <a href="/dashboard" class="btn btn-primary">Volver al inicio</a>
      <button onclick="window.history.back()" class="btn btn-ghost">Regresar</button>
    </div>
  </section>
</main>

<script>
  // ── Menu usuario ──────────────────────────────────────────────
  function toggleMenu() { document.getElementById('userDropdown').classList.toggle('open'); }
  document.addEventListener('click', e => {
    const w = document.getElementById('userMenuWrap');
    if (w && !w.contains(e.target)) document.getElementById('userDropdown').classList.remove('open');
  });
</script>

</body>
</html>
