<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esítiron — Error</title>
  <link rel="icon" type="image/png" href="/img/logo.jpg">
  
  <style>
    /* ==========================================================================
       VARIABLES Y ESTILOS BASE
       ========================================================================== */
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap');

    :root {
      --bg: #F9FAFB;
      --white: #FFFFFF;
      --surface: #FFFFFF;
      --surface2: #F3F4F6;
      --border: #E5E7EB;
      --border2: #D1D5DB;
      --text: #1F2937;
      --text2: #6B7280;
      --text3: #9CA3AF;
      --accent: #10B981;
      --accent-hv: #059669;
      --accent-lt: #D1FAE5;
      --red: #EF4444;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 4px 20px rgba(0,0,0,0.05);
      --shadow-accent: 0 4px 20px rgba(16,185,129,0.25);
      --nav-bg: rgba(255,255,255,0.85);
      --nav-h: 64px;
    }

    html.dark {
      --bg: #09090b;
      --white: #18181b;
      --surface: #18181b;
      --surface2: #27272a;
      --border: #27272a;
      --border2: #3f3f46;
      --text: #fafafa;
      --text2: #a1a1aa;
      --text3: #71717a;
      --accent: #34D399;
      --accent-hv: #10B981;
      --accent-lt: rgba(52,211,153,0.12);
      --nav-bg: rgba(24,24,27,0.9);
      --shadow: none;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s ease;
    }

    /* ==========================================================================
       NAVBAR
       ========================================================================== */
    .navbar {
      position: sticky; top: 0; z-index: 100; height: var(--nav-h);
      background: var(--nav-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border); display: flex;
      align-items: center; justify-content: space-between; padding: 0 1.5rem;
    }

    .nav-left { display: flex; align-items: center; gap: 0.5rem; }
    
    .nav-link {
      padding: 0.5rem 0.8rem; border-radius: var(--radius-sm);
      color: var(--text2); font-size: 0.875rem; font-weight: 500; text-decoration: none;
      transition: all 0.2s;
    }
    .nav-link:hover { background: var(--surface2); color: var(--text); }

    .nav-right { display: flex; align-items: center; gap: 1rem; }

    .nav-user {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.35rem 0.8rem 0.35rem 0.35rem; border-radius: 40px;
      background: var(--surface2); border: 1px solid var(--border);
    }

    .avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #34D399);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 700; color: #fff;
      object-fit: cover; border: 1px solid rgba(0,0,0,0.05);
    }

    /* ==========================================================================
       CONTENIDO ERROR
       ========================================================================== */
    .main { max-width: 800px; margin: 0 auto; padding: 4rem 2rem; text-align: center; }

    .error-code {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(6rem, 15vw, 9rem); font-weight: 800;
      background: linear-gradient(135deg, var(--accent), #34D399);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      line-height: 1; margin-bottom: 1rem;
    }

    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.75rem 1.5rem; border-radius: var(--radius-sm);
      font-size: 0.9rem; font-weight: 600; text-decoration: none; transition: all 0.2s;
    }
    .btn-primary { background: var(--accent); color: #fff; box-shadow: var(--shadow-accent); }
    .btn-primary:hover { background: var(--accent-hv); transform: translateY(-1px); }

    .theme-toggle {
      width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border);
      background: var(--white); cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
  </style>
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-left">
    <a href="/dashboard" class="nav-link">📊 Dashboard</a>
    <a href="/tiquets" class="nav-link">🧾 Tiquets</a>
  </div>

  <div class="nav-right">
    {% if usuario %}
    <div class="nav-user">
      {% if avatar_url %}
        <img src="{{ avatar_url }}" alt="Avatar" class="avatar">
      {% else %}
        <div class="avatar">{{ usuario[0] | upper }}</div>
      {% endif %}
      <span style="font-weight: 600; font-size: 0.85rem;">{{ usuario }}</span>
    </div>
    {% endif %}
    
    <button class="theme-toggle" id="theme-toggle" title="Cambiar tema">🌓</button>
  </div>
</nav>

<main class="main">
  <div class="error-illustration" style="font-size: 4rem;">🧩</div>
  <h1 class="error-code">404</h1>
  <h2 style="font-family: 'Plus Jakarta Sans'; font-size: 1.8rem; margin-bottom: 1rem;">¿Te has perdido?</h2>
  <p style="color: var(--text2); margin-bottom: 2.5rem; font-size: 1.1rem;">
    No hemos podido encontrar la página o el tiquet que buscas. 
  </p>

  <div style="display: flex; gap: 1rem; justify-content: center;">
    <a href="/dashboard" class="btn btn-primary">Volver al inicio</a>
    <button onclick="window.history.back()" class="btn" style="background: var(--surface2); color: var(--text);">Regresar</button>
  </div>
</main>

<script>
  // Script básico para el toggle de tema (Modo Oscuro)
  const btn = document.getElementById('theme-toggle');
  btn.addEventListener('click', () => {
    document.documentElement.classList.toggle('dark');
    const isDark = document.documentElement.classList.contains('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
  });

  // Persistencia simple
  if (localStorage.getItem('theme') === 'dark') {
    document.documentElement.classList.add('dark');
  }
</script>

</body>
</html>
