services:

  tailscale:
      image: tailscale/tailscale:latest
      container_name: tailscale
      environment:
        - TS_AUTHKEY=${TAILSCALE_AUTHKEY}
        - TS_HOSTNAME=${TS_HOSTNAME:-mi-app-tickets}
        - TS_STATE_DIR=/var/lib/tailscale
      volumes:
        - tailscale_state:/var/lib/tailscale
        - ./tailscale/entrypoint.sh:/entrypoint-funnel.sh:ro
        - /dev/net/tun:/dev/net/tun
      cap_add:
        - NET_ADMIN
      entrypoint: ["/bin/sh", "/entrypoint-funnel.sh"]
      networks:
        - red_publica
        - red_interna
        - red_monitoring
      depends_on:
        - proxy
        - proxysql
      restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - red_publica
    depends_on:
      - proxy
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    container_name: nginx_proxy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web/views:/usr/share/nginx/html/views:ro
    ports:
      - "8080:80"
    networks:
      - red_publica
      - red_monitoring
    depends_on:
      - web
    restart: always

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter
    command:
      - "--nginx.scrape-uri=http://nginx_proxy/nginx_status"
    networks:
      - red_monitoring
      - red_publica
    depends_on:
      - proxy
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════════
  #  APLICACIÓN
  # ══════════════════════════════════════════════════════════════

  web:
    build: ./web
    container_name: app_servidor
    user: "node" # Forzamos ejecución sin permisos de administrador
    security_opt:
      - no-new-privileges:true # Evitar adquirir nuevos privilegios
    cap_drop:
      - ALL
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    env_file:
      - ./.env
    environment:
      - DB_HOST=proxysql  # Antes era 'db'
      - DB_PORT=6033      # <--- ¡Añade esto! ProxySQL escucha aquí
      - OCR_HOST=ocr
      - NODE_ENV=${NODE_ENV:-production}
    networks:
      - red_publica
      - red_interna
      - red_procesamiento
      - red_monitoring
    depends_on:
      proxysql:
        condition: service_started
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  ocr:
    build: ./ocr
    container_name: ocr_ia
    volumes:
      - ./ocr:/app
    env_file:
      - ./.env
    networks:
      - red_procesamiento
      - red_ia
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: on-failure

  db:
    image: mysql:8.0
    container_name: db_mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --skip-character-set-client-handshake
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --default-authentication-plugin=mysql_native_password
    env_file:
      - ./.env
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME:-tiquets_db}
      - MYSQL_USER=${DB_USER:-user_seguro}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    networks:
      - red_interna
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db_base:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  db_replica:
    image: mysql:8.0
    container_name: db_mysql_slave
    command: >
      bash -c "(while true; do /usr/local/bin/auto_promote.sh; sleep 10; done &) && 
      /usr/local/bin/docker-entrypoint.sh mysqld 
      --character-set-server=utf8mb4 
      --collation-server=utf8mb4_unicode_ci 
      --server-id=2 
      --relay-log=relay-bin 
      --read-only=1 
      --super-read-only=1 
      --gtid-mode=ON 
      --enforce-gtid-consistency=ON 
      --default-authentication-plugin=mysql_native_password"
    env_file:
      - ./.env
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    networks:
      - red_interna
    volumes:
      - mysql_slave_data:/var/lib/mysql
      - ./monitoring/scripts/sql/auto_promote.sh:/usr/local/bin/auto_promote.sh:ro
      - ./.env:/app/.env:ro
    entrypoint: >
      bash -c "(while true; do /usr/local/bin/auto_promote.sh; sleep 10; done &) && 
      /usr/local/bin/docker-entrypoint.sh mysqld --server-id=2 --gtid-mode=ON --enforce-gtid-consistency=ON"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  proxysql:
      image: proxysql/proxysql:latest
      container_name: proxysql
      ports:
        - "6032:6032"
        - "6033:6033"
      networks:
        - red_interna
        - red_monitoring
      volumes:
        - proxysql_data:/var/lib/proxysql
        - ./proxysql.cnf:/etc/proxysql.cnf:ro
        - ./.env:/app/.env:ro
      depends_on:
        db:
          condition: service_healthy
      restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--no-collector.systemd'
      - '--no-collector.nfs'
      - '--no-collector.nfsd'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - red_monitoring
    restart: unless-stopped

  # Servei per a protegir Docker i evitar que cAdvisor accedeixi directament al socket del host.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: socket-proxy
    environment:
      - CONTAINERS=1 # Permite leer metadatos de contenedores
      - INFO=1       # Permite leer info básica
      - EVENTS=1     # Permite leer eventos
      - NETWORKS=1   # Permite leer redes (necesario para discovery de promtail)
      - VERSION=1    # Permite leer version del daemon (requerido por cAdvisor)
      - POST=0       # BLOQUEA la creación de contenedores
      - BUILD=0      # BLOQUEA construcciones
      - EXEC=0       # BLOQUEA la ejecución de comandos
    volumes:
      - ${XDG_RUNTIME_DIR}/docker.sock:/var/run/docker.sock:ro
    networks:
      - red_monitoring
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    command:
      - '--containerd=/run/containerd/containerd.sock'
      - '--containerd-namespace=moby'
      - '--docker_only=true'
      - '--whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project'
      - '--store_container_labels=true'
      - '--docker=http://socket-proxy:2375'
    volumes:
      - /:/rootfs:ro
      - /dev/disk/:/dev/disk:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - ${HOME}/.local/share/docker:/var/lib/docker:ro
      - ${XDG_RUNTIME_DIR}/docker/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    networks:
      - red_monitoring
    restart: unless-stopped

  mysql-exporter:
    image: prom/mysqld-exporter:v0.14.0
    container_name: mysql-exporter
    environment:
      - DATA_SOURCE_NAME=${DB_USER}:${DB_PASSWORD}@(db:3306)/
    command:
      - "--no-collect.slave_status"
      - "--collect.info_schema.innodb_metrics"
      - "--collect.info_schema.processlist"
    networks:
      - red_interna
      - red_monitoring
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - red_monitoring
    depends_on:
      - node-exporter
      - cadvisor
      - mysql-exporter
      - nginx-exporter
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    env_file:
      - ./.env
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://grafana:3000/
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - red_monitoring
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.1
    container_name: loki
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks:
      - red_monitoring
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.1
    container_name: promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail/config.yml:/etc/promtail/config.yml:ro
      - promtail_data:/tmp
      - ${HOME}/.local/share/docker/containers:/var/lib/docker/containers:ro
    networks:
      - red_monitoring
    depends_on:
      - loki
      - socket-proxy
    restart: unless-stopped

networks:
  red_publica:
  red_interna:
    internal: true
  red_procesamiento:
    internal: true
  red_ia:
    driver: bridge
  red_monitoring:

volumes:
  mysql_data:
  mysql_slave_data:
  tailscale_state:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_data:
  web_node_modules:
  proxysql_data: