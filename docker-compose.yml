services:

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY}
      - TS_HOSTNAME=${TS_HOSTNAME:-mi-app-tickets}
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./tailscale/entrypoint.sh:/entrypoint-funnel.sh:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    entrypoint: ["/bin/sh", "/entrypoint-funnel.sh"]
    network_mode: "service:proxy"
    depends_on:
      proxy:
        condition: service_started
        restart: true
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - red_publica
    depends_on:
      - proxy
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    container_name: nginx_proxy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web/views:/usr/share/nginx/html/views:ro
    ports:
      - "8080:80"
    networks:
      - red_publica
      - red_monitoring
    depends_on:
      - web
    restart: always

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter
    command:
      - "--nginx.scrape-uri=http://nginx_proxy/nginx_status"
    networks:
      - red_monitoring
      - red_publica
    depends_on:
      - proxy
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════════
  #  APLICACIÓN
  # ══════════════════════════════════════════════════════════════

  web:
    build: ./web
    container_name: app_servidor
    user: "node" # Forzamos ejecución sin permisos de administrador
    security_opt:
      - no-new-privileges:true # Evitar adquirir nuevos privilegios
    cap_drop:
      - ALL
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    env_file:
      - ./.env
    environment:
      - DB_HOST=proxysql
      - DB_PORT=3306
      - OCR_HOST=ocr
      - NODE_ENV=${NODE_ENV:-production}
    networks:
      - red_publica
      - red_interna
      - red_procesamiento
      - red_monitoring
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  ocr:
    build: ./ocr
    container_name: ocr_ia
    volumes:
      - ./ocr:/app
    env_file:
      - ./.env
    networks:
      - red_procesamiento
      - red_ia
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: on-failure

  db:
    image: mysql:8.0
    container_name: db_mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --skip-character-set-client-handshake
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --log-slave-updates=ON
    env_file:
      - ./.env
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME:-tiquets_db}
      - MYSQL_USER=${DB_USER:-user_seguro}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    networks:
      - red_interna
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db_base:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  db_replica:
    image: mysql:8.0
    container_name: db_mysql_slave
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --skip-character-set-client-handshake
      --server-id=2
      --read-only=1
      --log-bin=mysql-bin
      --relay-log=relay-bin
      --binlog-format=ROW
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --log-slave-updates=ON
    env_file:
      - ./.env
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    networks:
      - red_interna
    volumes:
      - mysql_slave_data:/var/lib/mysql
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  proxysql:
    image: proxysql/proxysql:2.6
    container_name: proxysql
    env_file:
      - ./.env
    environment:
      - PROXYSQL_ADMIN_USER=${PROXYSQL_ADMIN_USER}
      - PROXYSQL_ADMIN_PASSWORD=${PROXYSQL_ADMIN_PASSWORD}
      - PROXYSQL_ADMIN_PORT=${PROXYSQL_ADMIN_PORT:-6032}
      - PROXYSQL_PORT=${PROXYSQL_PORT:-3306}
      - PROXYSQL_MONITOR_USER=${PROXYSQL_MONITOR_USER}
      - PROXYSQL_MONITOR_PASSWORD=${PROXYSQL_MONITOR_PASSWORD}
      - PROXYSQL_STATS_USER=${PROXYSQL_STATS_USER}
      - PROXYSQL_STATS_PASSWORD=${PROXYSQL_STATS_PASSWORD}
      - MYSQL_MASTER_HOST=db
      - MYSQL_REPLICA_HOST=db_replica
      - MYSQL_PORT=3306
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./proxysql/proxysql.cnf.template:/etc/proxysql.cnf.template:ro
      - ./proxysql/entrypoint.sh:/entrypoint.sh:ro
      - proxysql_data:/var/lib/proxysql
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    networks:
      - red_interna
    depends_on:
      db:
        condition: service_healthy
      db_replica:
        condition: service_started
    restart: unless-stopped

  failover-manager:
    image: mysql:8.0
    container_name: failover-manager
    env_file:
      - ./.env
    environment:
      - MYSQL_MASTER_HOST=db
      - MYSQL_REPLICA_HOST=db_replica
      - MYSQL_PORT=3306
      - MYSQL_ROOT_USER=root
      - DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - REPLICATION_USER=${REPLICATION_USER}
      - REPLICATION_PASSWORD=${REPLICATION_PASSWORD}
      - FAILOVER_CHECK_INTERVAL=${FAILOVER_CHECK_INTERVAL:-10}
      - FAILOVER_AUTO_REJOIN=${FAILOVER_AUTO_REJOIN:-true}
      - FAILOVER_ENABLED=${FAILOVER_ENABLED:-true}
    volumes:
      - ./monitoring/scripts/failover/failover_manager.sh:/scripts/failover_manager.sh:ro
      - failover_state:/var/lib/failover
    entrypoint: ["/bin/sh", "/scripts/failover_manager.sh"]
    networks:
      - red_interna
    depends_on:
      db:
        condition: service_healthy
      db_replica:
        condition: service_started
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--no-collector.systemd'
      - '--no-collector.nfs'
      - '--no-collector.nfsd'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - red_monitoring
    restart: unless-stopped

  # Servei per a protegir Docker i evitar que cAdvisor accedeixi directament al socket del host.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: socket-proxy
    environment:
      - CONTAINERS=1 # Permite leer metadatos de contenedores
      - INFO=1       # Permite leer info básica
      - EVENTS=1     # Permite leer eventos
      - NETWORKS=1   # Permite leer redes (necesario para discovery de promtail)
      - VERSION=1    # Permite leer version del daemon (requerido por cAdvisor)
      - POST=0       # BLOQUEA la creación de contenedores
      - BUILD=0      # BLOQUEA construcciones
      - EXEC=0       # BLOQUEA la ejecución de comandos
    volumes:
      - ${XDG_RUNTIME_DIR}/docker.sock:/var/run/docker.sock:ro
    networks:
      - red_monitoring
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    command:
      - '--docker=tcp://socket-proxy:2375' # Usa el proxy en lugar del socket físico
      - '--docker_only=true'
    volumes:
      - /:/rootfs:ro
      - /dev/disk/:/dev/disk:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - ${HOME}/.local/share/docker:/var/lib/docker:ro
      - ${XDG_RUNTIME_DIR}/docker/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    networks:
      - red_monitoring
    depends_on:
      - socket-proxy # <-- Añadido para que arranque primero el proxy
    restart: unless-stopped

  mysql-exporter:
    image: prom/mysqld-exporter:v0.14.0
    container_name: mysql-exporter
    environment:
      - DATA_SOURCE_NAME=${DB_USER}:${DB_PASSWORD}@(db:3306)/
    command:
      - "--no-collect.slave_status"
      - "--collect.info_schema.innodb_metrics"
      - "--collect.info_schema.processlist"
    networks:
      - red_interna
      - red_monitoring
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  mysql-exporter-replica:
    image: prom/mysqld-exporter:v0.14.0
    container_name: mysql-exporter-replica
    environment:
      - DATA_SOURCE_NAME=${DB_USER}:${DB_PASSWORD}@(db_replica:3306)/
    command:
      - "--collect.info_schema.innodb_metrics"
      - "--collect.info_schema.processlist"
    networks:
      - red_interna
      - red_monitoring
    depends_on:
      db_replica:
        condition: service_started
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - red_monitoring
    depends_on:
      - node-exporter
      - cadvisor
      - mysql-exporter
      - mysql-exporter-replica
      - nginx-exporter
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    env_file:
      - ./.env
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://grafana:3000/
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - red_monitoring
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.1
    container_name: loki
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks:
      - red_monitoring
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.1
    container_name: promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail/config.yml:/etc/promtail/config.yml:ro
      - promtail_data:/tmp
      - ${HOME}/.local/share/docker/containers:/var/lib/docker/containers:ro
    networks:
      - red_monitoring
    depends_on:
      - loki
      - socket-proxy
    restart: unless-stopped

networks:
  red_publica:
  red_interna:
    internal: true
  red_procesamiento:
    internal: true
  red_ia:
    driver: bridge
  red_monitoring:

volumes:
  mysql_data:
  mysql_slave_data:
  tailscale_state:
  proxysql_data:
  failover_state:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_data:
  web_node_modules:
